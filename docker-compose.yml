# OrderFit MVP: Postgres + one-shot migrations + API + web.
#   docker compose up --build
#   Web       http://localhost:${WEB_PORT:-3000} (same-origin proxy to API)
#   API/DB    internal only; use `docker compose exec api ...` / `docker compose exec db ...`
# Host web port is overridable when taken, e.g. WEB_PORT=3001 in a root .env file.

name: orderfit

x-account-mail-environment: &account-mail-environment
  ACCOUNT_EMAIL_MODE: ${ACCOUNT_EMAIL_MODE:-off}
  ACCOUNT_EMAIL_ENVIRONMENT: ${ACCOUNT_EMAIL_ENVIRONMENT:-development}
  EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
  PASSWORD_RECOVERY_ENABLED: ${PASSWORD_RECOVERY_ENABLED:-false}
  INVITATION_EMAIL_ENABLED: ${INVITATION_EMAIL_ENABLED:-false}
  PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:3000}
  ACCOUNT_EMAIL_FROM: ${ACCOUNT_EMAIL_FROM:-accounts@example.test}
  ACCOUNT_EMAIL_ACTIVE_KEY_ID: ${ACCOUNT_EMAIL_ACTIVE_KEY_ID:-}
  ACCOUNT_EMAIL_ENCRYPTION_KEYS: '${ACCOUNT_EMAIL_ENCRYPTION_KEYS:-{}}'
  ACCOUNT_EMAIL_SOURCE_LIMIT: ${ACCOUNT_EMAIL_SOURCE_LIMIT:-300}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}

# Run the setup-profile provision job once after migration, before API/worker startup.
# Credentials are injected separately; runtime startup rejects privileged logins.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderfit_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local bootstrap password}
      POSTGRES_DB: ${POSTGRES_DB:-orderfit}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: orderfit-api:local   # same image as api, built once
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true       # one-shot job; the image's HTTP healthcheck doesn't apply
    environment:
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set the migration-only direct URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      # Direct migrations may target the separately configured Neon database.
      # Keep database traffic off the browser-facing network while allowing that
      # explicitly configured outbound connection.
      - egress
    restart: "no"

  provision:
    profiles: ["setup"]
    image: orderfit-api:local
    pull_policy: never
    command: ["python", "-m", "orderfit.store.provision"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set the migration-only direct URL}
      RUNTIME_LOGIN: ${RUNTIME_LOGIN:-orderfit_runtime}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:-}
      WORKER_LOGIN: ${WORKER_LOGIN:-orderfit_worker_login}
      WORKER_PASSWORD: ${WORKER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - egress
    restart: "no"

  api:
    build: ./backend
    image: orderfit-api:local
    environment:
      <<: *account-mail-environment
      DATABASE_URL: ${DATABASE_URL:?Set the restricted runtime URL}
      DOCUMENT_DIR: /app/var/documents
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-filesystem}
      DOCUMENT_S3_BUCKET: ${DOCUMENT_S3_BUCKET:-}
      DOCUMENT_S3_REGION: ${DOCUMENT_S3_REGION:-}
      DOCUMENT_S3_ENDPOINT_URL: ${DOCUMENT_S3_ENDPOINT_URL:-}
      DOCUMENT_S3_ACCESS_KEY_ID: ${DOCUMENT_S3_ACCESS_KEY_ID:-}
      DOCUMENT_S3_SECRET_ACCESS_KEY: ${DOCUMENT_S3_SECRET_ACCESS_KEY:-}
      DOCUMENT_S3_ADDRESSING_STYLE: ${DOCUMENT_S3_ADDRESSING_STYLE:-auto}
      LLM_MODE: ${LLM_MODE:-off}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ACCOUNT_FINGERPRINT_KEY: ${ACCOUNT_FINGERPRINT_KEY:-}
      ACCOUNT_FINGERPRINT_KEY_VERSION: ${ACCOUNT_FINGERPRINT_KEY_VERSION:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # Explicit proxy trust; [] ignores X-Forwarded-* (the browser reaches the API directly).
      TRUSTED_PROXY_IPS: '${TRUSTED_PROXY_IPS:-[]}'
      ADMIN_READS_ENABLED: ${ADMIN_READS_ENABLED:-false}
    volumes:
      - documents:/app/var      # uploaded documents survive restarts
      - ./data:/app/data:ro     # demo business, catalogue, test cases
    networks:
      - default
      # The runtime DB can be a hosted Neon endpoint. This private egress
      # network supplies outbound DNS/TLS only; the API has no published port.
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: orderfit-api:local
    pull_policy: never
    command: ["python", "-m", "orderfit.workflow.worker"]
    mem_limit: 768m
    healthcheck:
      disable: true
    environment:
      <<: *account-mail-environment
      ACCOUNT_EMAIL_WORKER_ENABLED: ${ACCOUNT_EMAIL_WORKER_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set the restricted worker URL}
      DOCUMENT_DIR: /app/var/documents
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-filesystem}
      DOCUMENT_S3_BUCKET: ${DOCUMENT_S3_BUCKET:-}
      DOCUMENT_S3_REGION: ${DOCUMENT_S3_REGION:-}
      DOCUMENT_S3_ENDPOINT_URL: ${DOCUMENT_S3_ENDPOINT_URL:-}
      DOCUMENT_S3_ACCESS_KEY_ID: ${DOCUMENT_S3_ACCESS_KEY_ID:-}
      DOCUMENT_S3_SECRET_ACCESS_KEY: ${DOCUMENT_S3_SECRET_ACCESS_KEY:-}
      DOCUMENT_S3_ADDRESSING_STYLE: ${DOCUMENT_S3_ADDRESSING_STYLE:-auto}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ACCOUNT_FINGERPRINT_KEY: ${ACCOUNT_FINGERPRINT_KEY:-}
      ACCOUNT_FINGERPRINT_KEY_VERSION: ${ACCOUNT_FINGERPRINT_KEY_VERSION:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      LLM_MODE: ${LLM_MODE:-off}
      LLM_RECORDINGS_DIR: ${LLM_RECORDINGS_DIR:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - documents:/app/var
    networks:
      - default
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Build-time rewrite is server-to-server over the internal network.
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: ""
    image: orderfit-web:local
    environment:
      # Server-side calls (e.g. /api/health) go over the compose network.
      API_INTERNAL_URL: http://api:8000
    networks:
      - default
      - edge
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  documents:

networks:
  default:
    # API, worker and database have no outbound route.
    internal: true
  edge:
    # Only the web proxy needs host/browser access. It has no DB/storage credentials.
    driver: bridge
  egress:
    # API, worker and one-shot setup jobs need outbound DNS/TLS when their
    # explicitly configured database is hosted. No service port is published on
    # this network, and the local PostgreSQL service remains internal-only.
    driver: bridge
