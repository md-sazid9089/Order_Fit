[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "orderfit"
version = "0.1.0"
description = "Order decision assistant: AI reads and writes, a deterministic engine decides."
requires-python = ">=3.12,<3.13"
# Direct compatibility bounds; uv.lock pins the entire resolved dependency graph.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "openai>=2,<3",
  "freellmpool==0.13.0",
  "argon2-cffi>=25,<26",
  "tzdata>=2025",
  "pypdf>=6.20.1",
  "boto3>=1.37.32,<2",
  "webauthn==3.0.1",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["orderfit"]

# Isolated wheel builds do not inherit runtime uv.lock constraints.
[tool.uv]
build-constraint-dependencies = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in external model calls; paid providers require explicit credentials and budget"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns code width; long docstrings are fine
