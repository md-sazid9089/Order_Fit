name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Code scanning (the Security tab) needs GitHub Code Security for private personal repos, so results
  # are not uploaded: each run keeps the SARIF report as an artifact and summarizes the result count.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            config: ./.github/codeql-python.yml
          - language: javascript-typescript
            config: ./.github/codeql.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.config }}
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - name: Summarize CodeQL results
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' "$RUNNER_TEMP"/codeql-results/*.sarif 2>/dev/null || echo unknown)
          echo "### CodeQL $LANGUAGE: $count result(s); download the codeql-$LANGUAGE artifact for details" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" != "0" ] && [ "$count" != "unknown" ]; then
            echo "::warning::CodeQL $LANGUAGE reported $count result(s); see the codeql-$LANGUAGE artifact"
          fi
      - name: Retain CodeQL report for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
          retention-days: 14

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.24
      - run: uv sync --frozen --extra dev
      - name: Export exact runtime dependencies with integrity hashes
        run: uv export --quiet --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/orderfit-runtime.txt"
      - name: Audit runtime dependencies and generate CycloneDX SBOM
        run: >-
          uv run --frozen python -m pip_audit --require-hashes --disable-pip --strict
          --progress-spinner off --format cyclonedx-json
          --output "$RUNNER_TEMP/orderfit-runtime.cdx.json"
          --requirement "$RUNNER_TEMP/orderfit-runtime.txt"
      - name: Retain dependency inventory for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-runtime-sbom
          path: ${{ runner.temp }}/orderfit-runtime.cdx.json
          if-no-files-found: warn
          retention-days: 14
