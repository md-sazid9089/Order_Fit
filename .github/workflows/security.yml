name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql.yml
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          category: /language:${{ matrix.language }}

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.24
      - run: uv sync --frozen --extra dev
      - name: Export exact runtime dependencies with integrity hashes
        run: uv export --quiet --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/orderfit-runtime.txt"
      - name: Audit runtime dependencies and generate CycloneDX SBOM
        run: >-
          uv run --frozen python -m pip_audit --require-hashes --disable-pip --strict
          --progress-spinner off --format cyclonedx-json
          --output "$RUNNER_TEMP/orderfit-runtime.cdx.json"
          --requirement "$RUNNER_TEMP/orderfit-runtime.txt"
      - name: Retain dependency inventory for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-runtime-sbom
          path: ${{ runner.temp }}/orderfit-runtime.cdx.json
          if-no-files-found: warn
          retention-days: 14
