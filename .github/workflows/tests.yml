name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orderfit
          POSTGRES_PASSWORD: orderfit
          POSTGRES_DB: orderfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderfit" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Migration-only bootstrap login. Runtime isolation tests land in P1.
      DATABASE_URL_DIRECT: postgresql+psycopg://orderfit:orderfit@localhost:5432/orderfit
      LLM_MODE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.24
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -m orderfit.contracts.export --check
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest tests/test_architecture.py tests/contracts tests/engine tests/agent -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install tsc --strict --noEmit ../docs/contracts/frontend-api.d.ts ../docs/contracts/typecheck.ts
        working-directory: frontend
      - run: uv run --frozen python ../docs/architecture/orderfit/fixtures/reference_engine.py --check
      - run: uv run --frozen python ../docs/architecture/orderfit/fixtures/selftest.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example build
