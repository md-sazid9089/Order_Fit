name: deploy-backend

# Deploys the backend to the Azure VM after `tests` passes on main.
#   build   -> image ghcr.io/<owner>/orderfit-backend:<commit>
#   plan    -> compares the Neon revision (read through the running API) with the image's head
#   migrate -> only when a migration is pending; waits for approval on the
#              `production-migration` environment, creates a Neon restore branch, runs Alembic once
#   deploy  -> swaps the image, waits for /ready, rolls back automatically if no migration ran
# The VM is reached with short-lived Azure OIDC tokens and Run Command; SSH stays closed.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  RESOURCE_GROUP: orderfit-rg
  VM_NAME: orderfit-vm
  API_URL: https://orderfit-api.centralindia.cloudapp.azure.com

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orderfit-backend:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false

  plan:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      current: ${{ steps.check.outputs.current }}
      head: ${{ steps.check.outputs.head }}
      migrate: ${{ steps.check.outputs.migrate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: check
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" --command-id RunShellScript \
            --scripts @deploy/azure/remote.sh --parameters check "$IMAGE" "$TOKEN" \
            --query "value[0].message" -o tsv)
          echo "$out" | grep -E '^RESULT_' || true
          echo "$out" | grep -qx 'RESULT_OK' || { echo "$out" | tail -20; exit 1; }
          current=$(echo "$out" | sed -n 's/^RESULT_CURRENT=//p')
          head=$(echo "$out" | sed -n 's/^RESULT_HEAD=//p')
          {
            echo "current=$current"
            echo "head=$head"
            echo "migrate=$([ "$current" = "$head" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "### Database $current, image requires $head" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    needs: [build, plan]
    if: needs.plan.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment so migrations wait for approval.
    environment: production-migration
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Create Neon restore branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: ${{ vars.NEON_PROJECT_ID }}
          PARENT: ${{ vars.NEON_PARENT_BRANCH_ID }}
          NAME: pre-${{ needs.plan.outputs.head }}-${{ github.run_id }}
        run: |
          api=https://console.neon.tech/api/v2/projects/$PROJECT/branches
          body=$(jq -n --arg p "$PARENT" --arg n "$NAME" '{branch: {parent_id: $p, name: $n}}')
          id=$(curl -fsS -X POST "$api" -H "Authorization: Bearer $NEON_API_KEY" \
               -H 'Content-Type: application/json' -d "$body" | jq -r '.branch.id')
          for _ in $(seq 1 30); do
            state=$(curl -fsS "$api/$id" -H "Authorization: Bearer $NEON_API_KEY" | jq -r '.branch.current_state')
            [ "$state" = ready ] && break
            sleep 2
          done
          [ "$state" = ready ] || { echo "Neon restore branch $id is $state"; exit 1; }
          echo "### Neon restore branch $NAME ($id) ready" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          IMAGE: ${{ needs.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" --command-id RunShellScript \
            --scripts @deploy/azure/remote.sh --parameters migrate "$IMAGE" "$TOKEN" \
            --query "value[0].message" -o tsv)
          echo "$out" | grep -E '^(RESULT_|INFO  \[alembic)' || true
          echo "$out" | grep -qx 'RESULT_OK' || { echo "$out" | tail -20; exit 1; }

  deploy:
    needs: [build, plan, migrate]
    if: >-
      always() && needs.build.result == 'success' && needs.plan.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          IMAGE: ${{ needs.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATED: ${{ needs.migrate.result == 'success' }}
        run: |
          compose=$(base64 -w0 deploy/azure/docker-compose.azure.yml)
          caddy=$(base64 -w0 deploy/azure/Caddyfile)
          out=$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" --command-id RunShellScript \
            --scripts @deploy/azure/remote.sh --parameters deploy "$IMAGE" "$TOKEN" "$MIGRATED" "$compose" "$caddy" \
            --query "value[0].message" -o tsv)
          echo "$out" | grep -E '^RESULT_' || true
          echo "$out" | grep -qx 'RESULT_OK' || { echo "$out" | tail -30; exit 1; }
      - name: Verify from the internet
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$API_URL/health"
          curl -fsS --retry 5 --retry-delay 5 "$API_URL/ready"
          echo "### Deployed ${{ needs.build.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
