# Render Blueprint — OrderFit Backend
# https://docs.render.com/blueprint-spec
#
# The frontend is deployed separately on Vercel (see docs/deployment/vercel.md).
# The database is hosted on Neon (see docs/evidence/reports/neon_connection_review.md).
#
# Usage:
#   1. Push this file to the repository.
#   2. In the Render dashboard, create a new Blueprint Instance pointing at this repo.
#   3. Set all environment variables marked sync: false in the Render dashboard.
#   4. Configure the private S3-compatible bucket and separate restricted DB logins.
#   5. Deploy. Pre-deploy migrations run with the direct URL; the API process drops it.
#
# Both services share one Docker image built from backend/Dockerfile.

services:
  # ── API (Web Service) ──────────────────────────────────────────────────
  - type: web
    name: orderfit-api
    runtime: docker
    repo: https://github.com/md-sazid9089/Order_Fit
    branch: deployment
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter            # $7/mo; free tier cold-starts break Vercel proxy
    region: oregon           # us-west, close to Neon's default US region
    healthCheckPath: /health

    # This runs in a separate pre-deploy process, before the service starts.
    # DATABASE_URL_DIRECT is a secret on this service for the migration phase.
    # The custom API command removes it before starting the long-running server.
    preDeployCommand: alembic upgrade head
    # Never pass the migration credential into the long-running API process.
    dockerCommand: /bin/sh -ec 'unset DATABASE_URL_DIRECT; exec python -m orderfit.api.serve'

    envVars:
      # Account mail remains off until schema/frontend/provider staging gates pass.
      - key: ACCOUNT_EMAIL_MODE
        value: "off"
      - key: ACCOUNT_EMAIL_ENVIRONMENT
        value: "production"
      - key: EMAIL_VERIFICATION_ENABLED
        value: "false"
      - key: PASSWORD_RECOVERY_ENABLED
        value: "false"
      - key: INVITATION_EMAIL_ENABLED
        value: "false"
      # Set PUBLIC_APP_ORIGIN, ACCOUNT_EMAIL_FROM, ACCOUNT_EMAIL_ACTIVE_KEY_ID,
      # ACCOUNT_EMAIL_ENCRYPTION_KEYS and RESEND_WEBHOOK_SECRET as dashboard secrets
      # before enabling; never inject RESEND_API_KEY into the API service.
      # ── Neon database (runtime restricted login) ──
      - key: DATABASE_URL
        sync: false          # set manually in dashboard — secret
      # ── Migrator-only credential (used only in preDeployCommand) ──
      - key: DATABASE_URL_DIRECT
        sync: false
      # ── Application secrets ──
      - key: SESSION_SECRET
        sync: false          # ≥32 chars, generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: ACCOUNT_FINGERPRINT_KEY
        sync: false          # ≥32 chars, must differ from SESSION_SECRET
      - key: ACCOUNT_FINGERPRINT_KEY_VERSION
        value: "1"
      # ── Shared private object storage (configure a private S3-compatible bucket) ──
      - key: DOCUMENT_DIR
        value: /tmp/orderfit/documents
      - key: DOCUMENT_STORAGE_BACKEND
        value: "s3"
      - key: DOCUMENT_S3_BUCKET
        sync: false
      - key: DOCUMENT_S3_REGION
        sync: false
      - key: DOCUMENT_S3_ENDPOINT_URL
        sync: false
      - key: DOCUMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: DOCUMENT_S3_SECRET_ACCESS_KEY
        sync: false
      # ── OpenAI / LLM ──
      - key: LLM_MODE
        value: "off"         # change to "live" after model evaluation
      - key: LLM_PROVIDER
        value: "openai"
      - key: FREELLMPOOL_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: ""
      # ── Cookie and CORS ──
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false          # JSON list, e.g. ["https://orderfit.vercel.app"]
      # ── Python performance ──
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Background Worker ──────────────────────────────────────────────────
  - type: worker
    name: orderfit-worker
    runtime: docker
    repo: https://github.com/md-sazid9089/Order_Fit
    branch: deployment
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon

    # Override the Dockerfile CMD to run the worker instead of uvicorn.
    dockerCommand: python -m orderfit.workflow.worker

    envVars:
      - key: ACCOUNT_EMAIL_MODE
        value: "off"
      - key: ACCOUNT_EMAIL_ENVIRONMENT
        value: "production"
      - key: EMAIL_VERIFICATION_ENABLED
        value: "false"
      - key: PASSWORD_RECOVERY_ENABLED
        value: "false"
      - key: INVITATION_EMAIL_ENABLED
        value: "false"
      - key: ACCOUNT_EMAIL_WORKER_ENABLED
        value: "false"
      # Same origin/sender/versioned keyring as API; RESEND_API_KEY is worker-only.
      # See docs/deployment/account-access.md for the complete settings and gates.
      # Worker uses its own restricted database login.
      - key: DATABASE_URL
        sync: false          # set to the WORKER_DATABASE_URL value (worker login)
      - key: DOCUMENT_DIR
        value: /tmp/orderfit/documents
      - key: DOCUMENT_STORAGE_BACKEND
        value: "s3"
      - key: DOCUMENT_S3_BUCKET
        sync: false
      - key: DOCUMENT_S3_REGION
        sync: false
      - key: DOCUMENT_S3_ENDPOINT_URL
        sync: false
      - key: DOCUMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: DOCUMENT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: LLM_MODE
        value: "off"
      - key: LLM_PROVIDER
        value: "openai"
      - key: FREELLMPOOL_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: ""
      - key: SESSION_SECRET
        sync: false
      - key: ACCOUNT_FINGERPRINT_KEY
        sync: false
      - key: ACCOUNT_FINGERPRINT_KEY_VERSION
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
