# Render Blueprint — OrderFit Backend
# https://docs.render.com/blueprint-spec
#
# The frontend is deployed separately on Vercel (see docs/deployment/vercel.md).
# The database is hosted on Neon (see docs/neon_connection_review.md).
#
# Usage:
#   1. Push this file to the repository.
#   2. In the Render dashboard, create a new Blueprint Instance pointing at this repo.
#   3. Set all environment variables marked sync: false in the Render dashboard.
#   4. Deploy. The pre-deploy command runs migrations before the API starts.
#
# Both services share one Docker image built from backend/Dockerfile.

services:
  # ── API (Web Service) ──────────────────────────────────────────────────
  - type: web
    name: orderfit-api
    runtime: docker
    repo: https://github.com/md-sazid9089/Order_Fit
    branch: deployment
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter            # $7/mo; free tier cold-starts break Vercel proxy
    region: oregon           # us-west, close to Neon's default US region
    healthCheckPath: /health

    # Runs inside the built image before each deploy. Uses the migrator URL
    # (DATABASE_URL_DIRECT) which is only available during this phase.
    preDeployCommand: alembic upgrade head

    envVars:
      # ── Neon database (runtime restricted login) ──
      - key: DATABASE_URL
        sync: false          # set manually in dashboard — secret
      # ── Migrator-only credential (used only in preDeployCommand) ──
      - key: DATABASE_URL_DIRECT
        sync: false
      # ── Application secrets ──
      - key: SESSION_SECRET
        sync: false          # ≥32 chars, generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: ACCOUNT_FINGERPRINT_KEY
        sync: false          # ≥32 chars, must differ from SESSION_SECRET
      - key: ACCOUNT_FINGERPRINT_KEY_VERSION
        value: "1"
      # ── Document storage (Render Persistent Disk) ──
      - key: DOCUMENT_DIR
        value: /var/data/orderfit/documents
      # ── OpenAI / LLM ──
      - key: LLM_MODE
        value: "off"         # change to "live" after model evaluation
      - key: LLM_PROVIDER
        value: "openai"
      - key: FREELLMPOOL_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: ""
      # ── Cookie and CORS ──
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false          # JSON list, e.g. ["https://orderfit.vercel.app"]
      # ── Python performance ──
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

    disk:
      name: orderfit-documents
      mountPath: /var/data/orderfit
      sizeGB: 1              # uploaded documents; increase as needed

  # ── Background Worker ──────────────────────────────────────────────────
  - type: worker
    name: orderfit-worker
    runtime: docker
    repo: https://github.com/md-sazid9089/Order_Fit
    branch: deployment
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon

    # Override the Dockerfile CMD to run the worker instead of uvicorn.
    dockerCommand: python -m orderfit.workflow.worker

    envVars:
      # Worker uses its own restricted database login.
      - key: DATABASE_URL
        sync: false          # set to the WORKER_DATABASE_URL value (worker login)
      - key: DOCUMENT_DIR
        value: /var/data/orderfit/documents
      - key: LLM_MODE
        value: "off"
      - key: LLM_PROVIDER
        value: "openai"
      - key: FREELLMPOOL_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: ""
      - key: SESSION_SECRET
        sync: false
      - key: ACCOUNT_FINGERPRINT_KEY
        sync: false
      - key: ACCOUNT_FINGERPRINT_KEY_VERSION
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

    disk:
      name: orderfit-worker-documents
      mountPath: /var/data/orderfit
      sizeGB: 1
